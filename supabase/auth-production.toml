# Reviewed desired Auth settings. NOT applied. Owner must confirm token rotation,
# SMTP configuration and preview tests before applying to the official project.
project_id = "csc-circle"
[auth]
site_url = "https://csc-circle-lake.vercel.app"
additional_redirect_urls = ["https://csc-circle-lake.vercel.app/auth/callback", "https://csc-circle-lake.vercel.app/auth/confirm", "https://csc-circle-lake.vercel.app/reset-password", "http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm", "http://localhost:3000/reset-password", "https://csc-circle-lake.vercel.app"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
[auth.email.template.confirmation]
subject = "Verify your CSC Circle email"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your CSC Circle password"
content_path = "./supabase/templates/recovery.html"

# SMTP is already configured remotely. Credentials remain in managed secrets.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "coimbatorestartupcommunity@gmail.com"
pass = "env(SMTP_PASSWORD)"
admin_email = "coimbatorestartupcommunity@gmail.com"
sender_name = "CSC Circle"
