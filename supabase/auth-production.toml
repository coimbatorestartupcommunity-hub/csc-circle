# CSC Circle Auth email template manifest. Only these email subject/body templates
# are published from this file. Provider, SMTP credentials, redirect allowlists,
# sign-in policies, and other hosted Auth settings are managed separately.
project_id = "csc-circle"

[auth.email.template.confirmation]
subject = "Verify your CSC Circle email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You are invited to CSC Circle"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your CSC Circle sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new CSC Circle email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your CSC Circle security code is {{ .Token }}"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.recovery]
subject = "Reset your CSC Circle password"
content_path = "./supabase/templates/recovery.html"
