version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csc-circle-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXT_PUBLIC_SUPABASE_URL=http://postgres:54321
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=local-dev-key
      - CSC_KV_REST_API_URL=http://redis:6379
      - CSC_KV_REST_API_TOKEN=local-token
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/internal/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: csc-circle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: csc-circle-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

  openwa:
    image: rmyndharis/openwa:latest
    container_name: csc-circle-openwa
    restart: always
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - BASE_PATH=/api
      - API_KEY=${OPENWA_API_KEY:-local-dev-api-key}
      - WEBHOOK_SSRF_PROTECT=false
      - SSRF_ALLOWED_HOSTS=host.docker.internal,127.0.0.1,localhost
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2785/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  redis_data:
  postgres_data:
  openwa_data:
